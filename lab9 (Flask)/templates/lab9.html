<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Карьерный трекер</title>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            margin: 0; 
            padding: 0; 
            background-color: #f4f7f6;
            color: #333;
        }

        header {
            background-color: #2c3e50;
            color: white;
            padding: 20px 40px;
            text-align: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .container {
            max-width: 900px;
            margin: 30px auto;
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }

        h2 { border-bottom: 2px solid #eee; padding-bottom: 10px; color: #2c3e50; }

        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            box-sizing: border-box;
        }

        button {
            background-color: #27ae60;
            color: white;
            padding: 12px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            transition: background 0.3s;
        }
        button:hover { background-color: #219150; }

        .btn-clear {
            background-color: #e74c3c;
            padding: 8px 15px;
            font-size: 14px;
        }
        .btn-clear:hover { background-color: #c0392b; }

        .header-flex {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #eee;
            padding-bottom: 10px;
            margin-bottom: 15px;
        }
        .header-flex h2 { border: none; padding: 0; margin: 0; }

        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #eee; }
        th { background-color: #f8f9fa; color: #666; text-transform: uppercase; font-size: 12px; }
        tr:hover { background-color: #fafafa; }

        .total { 
            background: #e8f6ef;
            padding: 15px;
            border-left: 5px solid #27ae60;
            font-weight: bold;
            font-size: 1.1em;
            color: #2c3e50;
        }
    </style>
</head>
<body>

    <header>
        <h1>Профессиональный опыт</h1>
    </header>

    <div class="container">
        <h2>Добавить место работы</h2>
        <form action="/add" method="POST">
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
                <div class="form-group">
                    <label>Название компании</label>
                    <input type="text" name="company" placeholder="Напр: Boston Dynamics" required>
                </div>
                <div class="form-group">
                    <label>Должность</label>
                    <input type="text" name="role_in_company" placeholder="Напр: Robotics Engineer">
                </div>
                <div class="form-group">
                    <label>Срок (в месяцах)</label>
                    <input type="number" name="term" min="1" required>
                </div>
                <div class="form-group">
                    <label>Порядковый номер</label>
                    <input type="number" name="number_of_company" required>
                </div>
            </div>
            <button type="submit">Сохранить запись</button>
        </form>

        <br><hr><br>

        <div class="header-flex">
            <h2>История трудоустройства</h2>
            <form action="/clear" method="POST" style="margin: 0;">
                <button type="submit" class="btn-clear" onclick="return confirm('Вы уверены, что хотите удалить все записи? Это действие нельзя отменить.');">
                    Очистить историю
                </button>
            </form>
        </div>
        
        <div class="total">
            Общий стаж работы: {{ total_time }}
        </div>

        <table>
            <thead>
                <tr>
                    <th>№</th>
                    <th>Компания</th>
                    <th>Должность</th>
                    <th>Срок</th>
                </tr>
            </thead>
            <tbody>
                {% for exp in experiences %}
                <tr>
                    <td>{{ exp.number_of_company }}</td>
                    <td><strong>{{ exp.company }}</strong></td>
                    <td>{{ exp.role_in_company or '-' }}</td>
                    <td>{{ exp.term }} мес.</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>

</body>
</html>
